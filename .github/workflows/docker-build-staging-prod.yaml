###### Generated using `argus bootstrap` command ######
name: Docker Image Build - staging/prod

on:
  - push

permissions:
  contents: read
  pull-requests: write
  id-token: write
  issues: write

jobs:
  staging_prod_argus_builder:
    uses: chanzuckerberg/github-actions/.github/workflows/argus-docker-build.yaml@v6
    secrets: inherit
    with:
      envs: staging,prod
      path_filters: '!.infra/**'
      branches_include: release-please--branches--main
      force_update_manifests: true
      images: |
        {
          "web": {
            "context": "Dockerfile",
            "dockerfile": "Dockerfile/Dockerfile",
            "platform": "linux/amd64"
          }
        }
