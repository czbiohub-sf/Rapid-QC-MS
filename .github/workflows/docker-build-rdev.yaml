name: Build and push Docker image (rdev)

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".infra/**"

permissions:
  id-token: write        # OIDC → ECR auth
  contents: write        # commit updated rdev/values.yaml back to the PR branch
  pull-requests: write   # required by nested argus-docker-build jobs
  issues: write          # required by nested argus-docker-build jobs

jobs:
  build:
    uses: chanzuckerberg/github-actions/.github/workflows/argus-docker-build.yaml@v6
    with:
      envs: '["rdev"]'
      images: |
        {
          "web": {
            "dockerfile": "Dockerfile",
            "context": "."
          }
        }
      arm_runner_labels: "['ubuntu-latest']"
      amd_runner_labels: "['ubuntu-latest']"
    secrets: inherit
