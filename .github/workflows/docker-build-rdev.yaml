name: Docker Image Build - rdev

on:
  push:
  pull_request:
    types: [ labeled ]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write

jobs:
  rdev_argus_builder:
    uses: chanzuckerberg/github-actions/.github/workflows/argus-docker-build.yaml@v6
    secrets: inherit
    with:
      envs: rdev
      path_filters: '!.infra/**'
      branches_ignore: main,release-please--branches--main
      arm_runner_labels: "['ubuntu-latest']"
      amd_runner_labels: "['ubuntu-latest']"
      images: |
        {
          "web": {
            "context": ".",
            "dockerfile": "Dockerfile",
            "platform": "linux/amd64"
          }
        }
