name: Create/update rdev stack

on:
  pull_request:
    types: [ labeled, synchronize ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-stack:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'stack')
    permissions:
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Create/update rdev stack
        id: stack
        uses: chanzuckerberg/argus-artifacts/ci/packages/create-stack@v0
        with:
          appName: rapid-qc-ms
          envName: rdev
          waitForDeploymentSeconds: 300
          postStackDetails: body

      - name: Print stack URL
        run: echo "rdev stack URL: $STACK_URL"
        env:
          STACK_URL: ${{ steps.stack.outputs.baseURL }}
