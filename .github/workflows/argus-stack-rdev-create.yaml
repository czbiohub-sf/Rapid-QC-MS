name: Create rdev stack (Argus)

on:
  pull_request:
    types:
      - labeled        # stack label added
      - synchronize    # new commits pushed while stack label is present
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write  # post stack URL to PR body

jobs:
  create:
    # Only run when the PR has the 'stack' label.
    if: contains(github.event.pull_request.labels.*.name, 'stack')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create rdev stack
        id: stack
        uses: chanzuckerberg/argus-artifacts/ci/packages/create-stack@v1
        with:
          appName: rapid-qc-ms
          envName: rdev
          waitForDeploymentSeconds: 300
          postStackDetails: body

      - name: Print stack URL
        run: echo "rdev stack URL: $STACK_URL"
        env:
          STACK_URL: ${{ steps.stack.outputs.baseURL }}
