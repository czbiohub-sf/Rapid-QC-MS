name: Build and push Docker image (prod)

on:
  push:
    branches:
      - main
    paths-ignore:
      # Avoid re-triggering on the tag-stamp commit that this workflow itself creates.
      - ".infra/**"

permissions:
  id-token: write   # required for OIDC → ECR auth
  contents: write   # required to commit the updated values.yaml back to the branch

jobs:
  build:
    uses: chanzuckerberg/github-actions/.github/workflows/argus-docker-build.yaml@v6
    with:
      envs: prod
      images: |
        {
          "web": {
            "context": ".",
            "dockerfile": "Dockerfile",
            "platform": "linux/amd64"
          }
        }
      arm_runner_labels: "['ubuntu-latest']"
      amd_runner_labels: "['ubuntu-latest']"
    secrets: inherit
