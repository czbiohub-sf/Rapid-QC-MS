# pyproject.toml

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-qc-ms"
version = "2.0.0"
description = "Realtime quality control for mass spectrometry data acquisition"
readme = "README.md"
authors = [{ name = "Brian DeFelice", email = "brian.defelice@czbiohub.org" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["mass-spectrometry", "mass-spec", "autoqc", "mass-spec-quality-control"]
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "plotly>=5.24,<6",
    "dash>=2.18,<3",
    "flask>=3.0",
    "dash_bootstrap_components>=1.6,<2",
    "psutil>=5.9",
    "pydrive2>=1.14",        # kept until Google Drive → S3 migration (Phase 3)
    "slack_sdk>=3.18",
    "sqlalchemy>=2.0,<3",
    "psycopg2-binary>=2.9",  # PostgreSQL driver (SQLite is the default for local dev)
    "watchdog>=4.0,<5",
    "gunicorn>=23.0",        # production WSGI server
    "pyteomics>=4.7",        # mzML scan-level proteomics QC
    "authlib>=1.3",          # Okta SSO (Phase 5)
    "pyyaml>=6.0",           # QC library config (qc_config.yaml)
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://czbiohub-sf.github.io/Rapid-QC-MS"

[project.scripts]
rapidqcms = "rapidqcms.__main__:main"

[tool.setuptools.package-data]
"rapidqcms.assets" = ["*.css", "*.ico"]
"rapidqcms.config" = ["*.toml", "*.yaml"]
