# Rapid-QC-MS quality-control library configuration
#
# This file defines the reference data used by QC modules:
#   - internal_standards : IS detection for metabolomics pre-search QC
#   - instrument_drift   : (future) per-instrument RT/mz drift thresholds
#   - bio_standards      : (future) biological reference sample definitions
#
# To use a custom config file instead of this one, set:
#   RAPIDQCMS_QC_CONFIG=/path/to/your/config.yaml
#
# To add a new chromatography method, add a new key under
# internal_standards (e.g. C18, PFPCol).  Each key contains
# Pos and Neg lists; each entry has name, mz, and rt (minutes).

internal_standards:
