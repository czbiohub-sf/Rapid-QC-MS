# Production overrides for the Argus stack chart.
#
# web.image.tag is stamped here automatically by the docker-build-prod GHA workflow
# on every push to main. Do not edit the tag manually.

services:
  web:
    image:
      tag: "latest"
    replicaCount: 2
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    # Uncomment to pin a custom hostname instead of the Argus-assigned random-pet URL:
    # ingress:
    #   host: rapid-qc-ms.prod-sci-data.prod.czi.team
  postgres:
    persistence:
      pvc:
        resources:
          requests:
            storage: 50Gi
