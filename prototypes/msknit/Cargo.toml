[package]
name = "msknit"
version = "0.1.0"
edition = "2021"
description = "Molecular networking from MSP spectral data"

[[bin]]
name = "msknit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
